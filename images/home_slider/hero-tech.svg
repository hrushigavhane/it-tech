<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <linearGradient id="heroGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#heroGrad1)" opacity="0.1"/>
  
  <!-- Main monitor/screen -->
  <rect x="150" y="80" width="300" height="200" rx="15" fill="#1F2937" stroke="url(#heroGrad2)" stroke-width="3"/>
  <rect x="165" y="95" width="270" height="150" rx="8" fill="#111827"/>
  
  <!-- Screen content - code lines -->
  <g opacity="0.8">
    <rect x="175" y="110" width="60" height="4" fill="url(#heroGrad2)"/>
    <rect x="245" y="110" width="40" height="4" fill="#10B981"/>
    <rect x="295" y="110" width="80" height="4" fill="#F59E0B"/>
    
    <rect x="175" y="125" width="80" height="4" fill="#EF4444"/>
    <rect x="265" y="125" width="50" height="4" fill="url(#heroGrad2)"/>
    <rect x="325" y="125" width="60" height="4" fill="#8B5CF6"/>
    
    <rect x="175" y="140" width="40" height="4" fill="#10B981"/>
    <rect x="225" y="140" width="90" height="4" fill="url(#heroGrad2)"/>
    <rect x="325" y="140" width="35" height="4" fill="#F59E0B"/>
    
    <rect x="175" y="155" width="70" height="4" fill="#8B5CF6"/>
    <rect x="255" y="155" width="45" height="4" fill="#EF4444"/>
    <rect x="310" y="155" width="55" height="4" fill="url(#heroGrad2)"/>
    
    <rect x="175" y="170" width="55" height="4" fill="#10B981"/>
    <rect x="240" y="170" width="75" height="4" fill="url(#heroGrad2)"/>
    
    <rect x="175" y="185" width="85" height="4" fill="url(#heroGrad2)"/>
    <rect x="270" y="185" width="60" height="4" fill="#F59E0B"/>
    
    <rect x="175" y="200" width="50" height="4" fill="#8B5CF6"/>
    <rect x="235" y="200" width="40" height="4" fill="#10B981"/>
    <rect x="285" y="200" width="70" height="4" fill="url(#heroGrad2)"/>
  </g>
  
  <!-- Monitor stand -->
  <rect x="285" y="280" width="30" height="40" fill="#374151"/>
  <rect x="270" y="320" width="60" height="8" rx="4" fill="#4B5563"/>
  
  <!-- Floating elements around -->
  <!-- Cloud -->
  <g transform="translate(480, 60)">
    <circle cx="20" cy="20" r="12" fill="url(#heroGrad2)" opacity="0.7"/>
    <circle cx="35" cy="20" r="15" fill="url(#heroGrad2)" opacity="0.7"/>
    <circle cx="50" cy="20" r="12" fill="url(#heroGrad2)" opacity="0.7"/>
    <rect x="8" y="20" width="54" height="15" fill="url(#heroGrad2)" opacity="0.7"/>
    <text x="32" y="48" font-family="Arial, sans-serif" font-size="8" fill="#4F46E5" text-anchor="middle">Cloud</text>
  </g>
  
  <!-- Mobile device -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="40" height="70" rx="8" fill="#1F2937" stroke="url(#heroGrad2)" stroke-width="2"/>
    <rect x="5" y="8" width="30" height="50" rx="3" fill="#111827"/>
    <circle cx="20" cy="63" r="3" fill="url(#heroGrad2)"/>
    <!-- Mobile screen content -->
    <rect x="8" y="12" width="24" height="2" fill="url(#heroGrad2)" opacity="0.6"/>
    <rect x="8" y="18" width="18" height="2" fill="#10B981" opacity="0.6"/>
    <rect x="8" y="24" width="22" height="2" fill="#F59E0B" opacity="0.6"/>
    <rect x="8" y="30" width="16" height="2" fill="#8B5CF6" opacity="0.6"/>
    <text x="20" y="85" font-family="Arial, sans-serif" font-size="8" fill="#4F46E5" text-anchor="middle">Mobile</text>
  </g>
  
  <!-- Database -->
  <g transform="translate(480, 250)">
    <ellipse cx="25" cy="5" rx="20" ry="5" fill="url(#heroGrad3)"/>
    <rect x="5" y="5" width="40" height="25" fill="url(#heroGrad3)" opacity="0.8"/>
    <ellipse cx="25" cy="15" rx="20" ry="5" fill="url(#heroGrad3)" opacity="0.9"/>
    <ellipse cx="25" cy="25" rx="20" ry="5" fill="url(#heroGrad3)" opacity="0.9"/>
    <ellipse cx="25" cy="30" rx="20" ry="5" fill="url(#heroGrad3)"/>
    <text x="25" y="50" font-family="Arial, sans-serif" font-size="8" fill="#4F46E5" text-anchor="middle">Database</text>
  </g>
  
  <!-- Network nodes -->
  <g transform="translate(100, 280)">
    <circle cx="15" cy="15" r="8" fill="url(#heroGrad2)" filter="url(#glow)"/>
    <circle cx="45" cy="25" r="6" fill="url(#heroGrad2)" filter="url(#glow)"/>
    <circle cx="25" cy="45" r="7" fill="url(#heroGrad2)" filter="url(#glow)"/>
    <line x1="15" y1="15" x2="45" y2="25" stroke="url(#heroGrad2)" stroke-width="2" opacity="0.6"/>
    <line x1="15" y1="15" x2="25" y2="45" stroke="url(#heroGrad2)" stroke-width="2" opacity="0.6"/>
    <line x1="45" y1="25" x2="25" y2="45" stroke="url(#heroGrad2)" stroke-width="2" opacity="0.6"/>
    <text x="30" y="70" font-family="Arial, sans-serif" font-size="8" fill="#4F46E5" text-anchor="middle">Network</text>
  </g>
  
  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="120" cy="50" r="2" fill="url(#heroGrad2)"/>
    <circle cx="480" cy="120" r="1.5" fill="#10B981"/>
    <circle cx="90" cy="180" r="1" fill="#F59E0B"/>
    <circle cx="520" cy="180" r="2" fill="#8B5CF6"/>
    <circle cx="140" cy="320" r="1.5" fill="url(#heroGrad2)"/>
    <circle cx="500" cy="320" r="1" fill="#10B981"/>
  </g>
  
  <!-- Animated connection lines -->
  <g opacity="0.3">
    <path d="M150 180 Q300 50 450 180" stroke="url(#heroGrad2)" stroke-width="1" fill="none" stroke-dasharray="5,5"/>
    <path d="M150 220 Q300 350 450 220" stroke="url(#heroGrad2)" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  </g>
</svg>