    <g opacity="0.6">
      <line x1="40" y1="12" x2="45" y2="12" stroke="url(#gradient2)" stroke-width="1"/>
      <line x1="45" y1="12" x2="45" y2="16" stroke="url(#gradient2)" stroke-width="1"/>
      <circle cx="45" cy="16" r="1.5" fill="url(#gradient2)"/>
