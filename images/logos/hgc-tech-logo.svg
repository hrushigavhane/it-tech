    <rect x="5" y="8" width="3" height="24" fill="url(#gradient1)"/>
    <rect x="12" y="8" width="3" height="24" fill="url(#gradient1)"/>
    <rect x="5" y="18" width="10" height="3" fill="url(#gradient1)"/>
    
    <!-- G -->
    <path d="M25 8 C32 8 37 13 37 20 C37 27 32 32 25 32 L22 32 L22 29 L25 29 C30 29 34 25 34 20 C34 15 30 11 25 11 L22 11 C17 11 13 15 13 20 L13 25 L28 25 L28 22 L25 22 L25 19 L31 19 L31 27 C31 30 28 32 25 32 L22 32 C16 32 10 27 10 20 C10 13 16 8 22 8 Z" fill="url(#gradient2)"/>
    
